[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "clicktodo"
version = "0.2.0"
description = "i3 status bar todo list with Rofi UI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.1.0",
]

[project.scripts]
clicktodo-ui = "clicktodo.adapters.rofi.app:main"

[project.entry-points."py3status"]
clicktodo = "clicktodo.adapters.py3status_bar:Py3status"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=clicktodo --cov-report=term-missing --cov-fail-under=80"

[tool.mypy]
packages = ["clicktodo"]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Allow gradual typing
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "clicktodo.adapters.py3status_bar",
]
ignore_errors = true  # py3status adds self.py3 at runtime

[tool.ruff]
src = ["src"]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "UP",   # pyupgrade
    "I",    # isort
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.isort]
known-first-party = ["clicktodo"]
